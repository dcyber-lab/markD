<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>markd</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="sidebar-header">
          <span id="folder-name"></span>
          <button id="new-file" class="icon-button" type="button" title="New File">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5.5z" />
              <path d="M9 1.5v4h4M8 8v4M6 10h4" />
            </svg>
          </button>
          <button id="new-folder" class="icon-button" type="button" title="New Folder">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.5 4a1 1 0 0 1 1-1h3.5l1.5 1.5h6a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" />
              <path d="M8 7v4M6 9h4" />
            </svg>
          </button>
        </header>
        <div id="tree"></div>
        <div id="sidebar-empty">
          <p>No folder open</p>
          <button id="open-folder" type="button">Open Folder…</button>
          <p class="hint">⌘/Ctrl + Shift + O</p>
        </div>
        <div id="sidebar-resizer"></div>
      </aside>
      <main id="workspace" data-mode="live">
        <div id="editor"></div>
      </main>
    </div>
    <footer id="statusbar">
      <button id="sidebar-toggle" class="icon-button" type="button" title="Toggle sidebar (⌘/Ctrl+Shift+E)">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" />
          <path d="M6 2.5v11" />
        </svg>
      </button>
      <span id="status"></span>
      <span id="status-items"></span>
      <button id="mode-toggle" type="button" title="⌘/Ctrl+\"></button>
    </footer>
  </body>
</html>
